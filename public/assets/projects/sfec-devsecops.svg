<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SFEC DevSecOps architecture illustration</title>
  <desc id="desc">Simplified architecture diagram for the SFEC national electronic invoicing platform.</desc>
  <rect width="1200" height="675" fill="#05070A"/>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.06 0 0 0 0 0.72 0 0 0 0 0.51 0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <path d="M94 119C219 54 360 47 489 94C624 143 666 228 811 195C946 164 1049 91 1131 127V675H0V174C27 155 58 138 94 119Z" fill="#0B1220"/>
  <path d="M94 119C219 54 360 47 489 94C624 143 666 228 811 195C946 164 1049 91 1131 127" stroke="#1F2937" stroke-width="2"/>
  <text x="64" y="82" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">SFEC</text>
  <text x="64" y="119" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="20">National e-invoicing platform infrastructure</text>
  <text x="64" y="153" fill="#10B981" font-family="JetBrains Mono, Consolas, monospace" font-size="18">50K+ invoices/hour • GitOps • mTLS • zero-downtime rolling updates</text>

